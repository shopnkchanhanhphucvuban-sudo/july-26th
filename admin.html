<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản trị — July 26th</title><link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="style.css"><style>.admin{max-width:900px;margin:40px auto;padding:24px}.panel{background:#fff;border:1px solid #eaded5;border-radius:20px;padding:25px;margin-bottom:20px}.panel input,.panel textarea,.panel select{width:100%;padding:12px;border:1px solid #e7d9d0;border-radius:10px;margin:7px 0 14px;font:inherit}.panel button{border:0;background:#d9a98e;color:#fff;padding:11px 16px;border-radius:12px;cursor:pointer}.hidden{display:none}.notice{background:#fff4ed;padding:12px;border-radius:12px;font-size:12px;line-height:1.6}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.adminhead{display:flex;align-items:center;justify-content:space-between}.adminhead img{width:90px}.result{padding:10px 0;border-bottom:1px solid #f0e6df;font-size:13px}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><div class="admin"><div class="adminhead"><img src="assets/logo.png"><a href="index.html">← Về website</a></div><section id="login" class="panel"><h2>Đăng nhập quản trị</h2><p class="notice">Khu vực này dành cho chủ shop. Bản hiện tại lưu sản phẩm trên trình duyệt của thiết bị đang dùng; đây chưa phải hệ thống quản trị server-side.</p><input id="pw" type="password" placeholder="Mật khẩu quản trị"><button id="loginBtn">Đăng nhập</button><p id="loginMsg"></p></section><section id="dashboard" class="hidden"><div class="panel"><h2>Thêm sản phẩm</h2><div class="row"><label>Tên sản phẩm<input id="name"></label><label>Giá<input id="price" type="number"></label></div><label>Danh mục<select id="cat"><option value="basic">Khăn basic</option><option value="long">Khăn len dài</option><option value="cute">Khăn len cute</option><option value="set">Set khăn len</option></select></label><button id="add">＋ Thêm sản phẩm</button></div><div class="panel"><h2>Sản phẩm đã thêm trên thiết bị này</h2><div id="list"></div><button id="logout">Đăng xuất</button></div></section></div><script>const KEY='j26_admin_products',PASS='July26th@2026';const login=document.querySelector('#login'),dash=document.querySelector('#dashboard');document.querySelector('#loginBtn').onclick=()=>{if(document.querySelector('#pw').value===PASS){sessionStorage.setItem('j26admin','1');login.classList.add('hidden');dash.classList.remove('hidden');draw()}else document.querySelector('#loginMsg').textContent='Mật khẩu chưa đúng ♡'};if(sessionStorage.getItem('j26admin')){login.classList.add('hidden');dash.classList.remove('hidden')}function get(){return JSON.parse(localStorage.getItem(KEY)||'[]')}function draw(){document.querySelector('#list').innerHTML=get().map((p,i)=>`<div class="result"><b>${p.name}</b> — ${Number(p.price).toLocaleString('vi-VN')}đ <button onclick="del(${i})">Xóa</button></div>`).join('')||'<p>Chưa có sản phẩm mới.</p>'}window.del=i=>{const a=get();a.splice(i,1);localStorage.setItem(KEY,JSON.stringify(a));draw()};document.querySelector('#add').onclick=()=>{const n=document.querySelector('#name').value.trim(),p=Number(document.querySelector('#price').value),c=document.querySelector('#cat').value;if(!n||!p)return alert('Nhập tên và giá nhé');const a=get();a.push({name:n,price:p,cat:c});localStorage.setItem(KEY,JSON.stringify(a));document.querySelector('#name').value='';document.querySelector('#price').value='';draw();alert('Đã thêm trên trình duyệt này ♡')};document.querySelector('#logout').onclick=()=>{sessionStorage.removeItem('j26admin');location.reload()};draw();</script></body></html>

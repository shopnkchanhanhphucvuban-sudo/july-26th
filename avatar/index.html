<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A1K106 • Avatar</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#ff9ac5,#ff4f93,#d91d69);color:white;text-align:center;overflow-x:hidden}.heart{position:fixed;bottom:-40px;font-size:25px;animation:up 7s linear infinite;opacity:.8;pointer-events:none}@keyframes up{to{transform:translateY(-110vh) rotate(360deg);opacity:0}}h1{font-size:44px;margin:25px 0 5px;animation:rain 2.4s infinite}.sub{margin:0 0 18px}.card{width:min(94vw,620px);margin:auto;padding:20px;border-radius:28px;background:#ffffff22;backdrop-filter:blur(12px);box-shadow:0 15px 50px #7d003d55}.stage{position:relative;width:min(90vw,560px);aspect-ratio:1;margin:auto;border-radius:28px;overflow:hidden;background:#fff8}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.photo{position:absolute;left:13%;top:11%;width:74%;height:74%;border-radius:50%;object-fit:cover;cursor:grab}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}button,label{border:0;border-radius:999px;padding:13px 20px;font-weight:800;cursor:pointer;background:white;color:#d52270}input{display:none}.hint{font-size:13px;opacity:.9}.logo{font-size:34px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#fff,#ff9ac5,#fff);background-size:200% auto;-webkit-background-clip:text;color:transparent;animation:rain 3s linear infinite}@keyframes rain{to{background-position:200% center}}</style><body><div id="hearts"></div><div class="logo">A1K106</div><h1>🎓 TẠO AVATAR A1K106 🎓</h1><p class="sub">THPT Huỳnh Thúc Kháng</p><div class="card"><div class="stage"><img id="photo" class="photo" alt="Ảnh của bạn"><div style="position:absolute;inset:0;border:5px solid #fff8;border-radius:28px;pointer-events:none"></div></div><div class="controls"><label>📷 Chọn ảnh<input id="file" type="file" accept="image/*"></label><button id="out">✨ Tạo & tải avatar</button><button onclick="window.open('https://www.facebook.com/','_blank')">📘 Mở Facebook</button></div><p class="hint">Chọn ảnh → kéo ảnh trong khung → bấm Tạo & tải avatar.</p></div><script>for(let i=0;i<28;i++){let s=document.createElement('span');s.className='heart';s.textContent=['♥','♡','💗','💖'][i%4];s.style.left=Math.random()*100+'%';s.style.animationDelay=Math.random()*7+'s';s.style.fontSize=16+Math.random()*25+'px';document.body.appendChild(s)}let f=document.getElementById('file'),p=document.getElementById('photo');f.onchange=e=>{let x=e.target.files[0];if(x)p.src=URL.createObjectURL(x)};document.getElementById('out').onclick=()=>{if(!p.src){alert('Hãy chọn ảnh trước nha 💗');return}let c=document.createElement('canvas'),x=c.getContext('2d');c.width=c.height=1000;x.save();x.beginPath();x.arc(500,500,370,0,Math.PI*2);x.clip();x.drawImage(p,130,130,740,740);x.restore();x.font='900 90px Arial';x.textAlign='center';x.fillStyle='#ff4f93';x.fillText('A1K106',500,940);let a=document.createElement('a');a.download='A1K106-avatar.png';a.href=c.toDataURL('image/png');a.click()};</script></body></html>
